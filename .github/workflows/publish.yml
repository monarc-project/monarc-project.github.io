name: Publish website

on:
  push:
    branches:
      - source

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install system dependencies (cairo)
        run: |
          printf '%s\t%s\n' 'https://archive.ubuntu.com/ubuntu' 'priority:1' \
            | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y \
            libcairo2-dev \
            pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry lxml ghp-import
          poetry install
          poetry run make html
          poetry run ghp-import output

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: master
